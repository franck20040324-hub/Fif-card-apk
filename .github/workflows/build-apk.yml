name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        shell: bash
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable not found in PATH."
            exit 1
          fi
          java -version
          JAVA_VER_LINE="$(java -version 2>&1 | head -n 1)"
          RAW_VER="$(echo "$JAVA_VER_LINE" | sed -n 's/.*"\([0-9][0-9]*\(\.[0-9]*\)*\)".*/\1/p')"
          if [ -z "$RAW_VER" ]; then
            echo "::error::Unable to detect active Java version from: $JAVA_VER_LINE"
            exit 1
          fi
          MAJOR_VER="${RAW_VER%%.*}"
          if [ "$MAJOR_VER" = "1" ]; then
            MAJOR_VER="$(echo "$RAW_VER" | cut -d. -f2)"
          fi
          echo "Detected Java major version: $MAJOR_VER"
          if ! [ "$MAJOR_VER" -ge 17 ] 2>/dev/null; then
            echo "::error::Java 17 or newer is required, but detected version $RAW_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        shell: bash
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Temporary debug.keystore already exists."
          else
            KEYTOOL_BIN="${JAVA_HOME:+$JAVA_HOME/bin/}keytool"
            if ! command -v "$KEYTOOL_BIN" >/dev/null 2>&1; then
              KEYTOOL_BIN="keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Verified ./debug.keystore is present for debug signing."

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        shell: bash
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ] && [ -s "$EXPECTED_APK" ] && [[ "$EXPECTED_APK" == *.apk ]]; then
            echo "Verified debug APK at: $EXPECTED_APK"
          else
            echo "::error::Expected debug APK not found or empty at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        run: |
          TMP_RELEASE_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")"
          DEST_APK="${TMP_RELEASE_DIR}/app-debug.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_APK"
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
        shell: bash
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not available."
            exit 1
          fi
          gh --version

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Prepared release APK asset is missing or empty."
            exit 1
          fi
          if [[ "$ASSET_PATH" != *.apk ]] || [ "$(basename "$ASSET_PATH")" != "app-debug.apk" ]; then
            echo "::error::Release asset filename must be exactly app-debug.apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          RELEASE_NOTES="$(printf '%s\n\n- %s\n- %s\n- %s\n- %s\n- %s' \
            "Automatically generated debug APK built by GitHub Actions." \
            "GitHub Actions Run Number: ${GITHUB_RUN_NUMBER}" \
            "GitHub Actions Run Attempt: ${GITHUB_RUN_ATTEMPT}" \
            "Source Commit SHA: ${GITHUB_SHA}" \
            "Purpose: Intended for testing only (not a Play Store production release)" \
            "Signing: Signed only with a temporary debug keystore")"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${GITHUB_SHA}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Release Tag: ${RELEASE_TAG}"
            echo "Release Title: ${RELEASE_TITLE}"
            echo "APK Filename: app-debug.apk"
            RELEASE_PAGE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
            echo "Release Page URL: ${RELEASE_PAGE_URL}"
            echo "Direct APK Download URL: ${DIRECT_URL}"
            echo "Backup GitHub Actions Artifact: app-debug-apk"

            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "${DIRECT_URL}"
              echo ""
              echo "- **Release Tag:** ${RELEASE_TAG}"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Page:** ${RELEASE_PAGE_URL}"
              echo "- **APK Filename:** app-debug.apk"
              echo "- **Backup Actions Artifact:** \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped."
            if [ "${{ steps.verify_apk.outcome }}" = "success" ]; then
              echo "The debug APK build succeeded (app/build/outputs/apk/debug/app-debug.apk)."
            else
              echo "The debug APK build did not succeed."
            fi
            if [ "${{ steps.upload_artifact.outcome }}" = "success" ]; then
              echo "The GitHub Actions backup artifact 'app-debug-apk' remains available."
            fi
            {
              echo "## Release Publishing Status"
              echo ""
              echo "Warning: GitHub Release publishing failed. Do not rely on the latest-release link for this run."
              if [ "${{ steps.upload_artifact.outcome }}" = "success" ]; then
                echo "- Backup GitHub Actions artifact \`app-debug-apk\` remains available."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
